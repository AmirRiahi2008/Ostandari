<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مودال سمت‌های شغلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #eef2f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* مودال */
        .job-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .job-modal {
            background: white;
            width: 460px;
            max-width: 90%;
            border-radius: 12px;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* هدر */
        .job-modal-header {
            padding: 18px 20px 10px 20px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }

        .job-modal-close-icon {
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }

        /* لیست */
        .job-modal-body {
            padding: 8px 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .job-modal-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f7fafc;
        }

        .job-modal-item:last-child {
            border-bottom: none;
        }

        .job-modal-title {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .job-modal-company {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }

        .job-modal-date {
            font-size: 12px;
            color: #94a3b8;
        }

        /* فوتر */
        .job-modal-footer {
            padding: 12px 20px 16px 20px;
            border-top: 1px solid #edf2f7;
            text-align: left;
        }

        .job-modal-close-btn {
            background: none;
            border: none;
            font-size: 13px;
            color: #64748b;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="job-modal-overlay">
    <div class="job-modal">
        <div class="job-modal-header">
            <h3>سمت‌های شغلی</h3>
            <span class="job-modal-close-icon">✕</span>
        </div>

        <div class="job-modal-body">
            <div class="job-modal-item">
                <div class="job-modal-title"><span style="color: rgb(133, 0, 0);">سمت شغلی:</span> مدیر ارشد محصول</div>
                <div class="job-modal-company">نام سازمان / شرکت: دیجی کالا</div>
                <div class="job-modal-date">۱۴۰۲ - اکنون</div>
            </div>
            <div class="job-modal-item">
                <div class="job-modal-title">مدیر محصول</div>
                <div class="job-modal-company">اسنپ</div>
                <div class="job-modal-date">۱۴۰۰ - ۱۴۰۲</div>
            </div>
            <div class="job-modal-item">
                <div class="job-modal-title">تحلیلگر کسب‌وکار</div>
                <div class="job-modal-company">همراه اول</div>
                <div class="job-modal-date">۱۳۹۸ - ۱۴۰۰</div>
            </div>
            <div class="job-modal-item">
                <div class="job-modal-title">توسعه‌دهنده فرانت‌اند</div>
                <div class="job-modal-company">ذوب آهن</div>
                <div class="job-modal-date">۱۳۹۷ - ۱۳۹۸</div>
            </div>
        </div>

        <div class="job-modal-footer">
            <button class="job-modal-close-btn">بستن</button>
        </div>
    </div>
</div>

</body>
</html>
